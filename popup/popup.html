<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Prism</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body class="theme-dark accent-violet">
  <header class="head">
    <div class="logo">💎</div>
    <div>
      <h1>Prism</h1>
      <p id="status" class="status">Loading…</p>
    </div>
    <button id="openOptions" class="icon-btn" title="Full settings">⚙️</button>
  </header>

  <section class="card">
    <button id="coachTab" class="btn primary full">✨ Coach the prompt on this tab</button>
    <p class="hint">Works on ChatGPT, Claude, Gemini, DeepSeek &amp; Perplexity. Shortcut: <kbd>Ctrl+Shift+E</kbd></p>
  </section>

  <section class="card">
    <h2>Quick settings</h2>
    <label class="row">
      <span>Coach engine</span>
      <select id="provider">
        <option value="offline">Rule-based (offline)</option>
        <option value="openai">OpenAI</option>
        <option value="anthropic">Anthropic (Claude)</option>
        <option value="gemini">Google Gemini</option>
        <option value="openrouter">OpenRouter</option>
        <option value="ollama">Ollama (local)</option>
      </select>
    </label>
    <label class="row inline">
      <span>Allow cloud AI</span>
      <input type="checkbox" id="allowCloud" />
    </label>
    <label class="row">
      <span>Theme</span>
      <select id="theme">
        <option value="dark">Dark</option>
        <option value="light">Light</option>
      </select>
    </label>
    <label class="row">
      <span>Accent</span>
      <select id="accent">
        <option value="violet">Violet</option>
        <option value="blue">Blue</option>
        <option value="green">Green</option>
        <option value="orange">Orange</option>
        <option value="pink">Pink</option>
        <option value="red">Red</option>
      </select>
    </label>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>Recent coaches</h2>
      <button id="clearHistory" class="icon-btn" title="Clear history">🗑️</button>
    </div>
    <ul id="history" class="history"></ul>
    <p id="historyEmpty" class="hint hidden">No coached prompts yet.</p>
  </section>

  <footer class="foot">
    <button id="openFavorites" class="link">★ Favorites</button>
    <span id="modeBadge" class="badge">offline</span>
  </footer>

  <script src="../utils/browserPolyfill.js"></script>
  <script src="../utils/storage.js"></script>
  <script src="../utils/promptAnalyzer.js"></script>
  <script src="../utils/templateManager.js"></script>
  <script src="../utils/api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
